name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  BIN_NAME: kbsink

jobs:
  build:
    name: ${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
    steps:
      - uses: actions/checkout@v4
        with:
          path: kbsink-cli

      - uses: actions/checkout@v4
        with:
          repository: kbsink-org/kbsink
          ref: main
          path: kbsink

      - uses: actions/checkout@v4
        with:
          repository: kbsink-org/douyin-plugin
          ref: main
          path: douyin-plugin

      - uses: actions/setup-go@v5
        with:
          go-version-file: kbsink-cli/go.mod
          cache-dependency-path: kbsink-cli/go.sum

      - name: Build and pack
        working-directory: kbsink-cli
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          ver="${GITHUB_REF_NAME}"
          out="${{ env.BIN_NAME }}"
          if [ "$GOOS" = "windows" ]; then out="${out}.exe"; fi
          go build -trimpath -ldflags="-s -w" -o "$out" ./cmd/kbsink
          asset="${{ env.BIN_NAME }}_${ver}_${GOOS}_${GOARCH}"
          mkdir -p release
          if [ "$GOOS" = "windows" ]; then
            final="${asset}.exe"
            mv "$out" "release/$final"
          else
            final="$asset"
            mv "$out" "$final"
            tar -czf "release/${asset}.tar.gz" "$final"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.goos }}-${{ matrix.goarch }}
          path: kbsink-cli/release/*

  wasm:
    name: wasm-js
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: kbsink-cli

      - uses: actions/checkout@v4
        with:
          repository: kbsink-org/kbsink
          ref: main
          path: kbsink

      - uses: actions/checkout@v4
        with:
          repository: kbsink-org/douyin-plugin
          ref: main
          path: douyin-plugin

      - uses: actions/setup-go@v5
        with:
          go-version-file: kbsink-cli/go.mod
          cache-dependency-path: kbsink-cli/go.sum

      - name: Pack wasm + wasm_exec.js
        working-directory: kbsink-cli
        env:
          CGO_ENABLED: "0"
          GOOS: js
          GOARCH: wasm
        run: |
          set -euo pipefail
          ver="${GITHUB_REF_NAME}"
          go build -trimpath -ldflags="-s -w" -o kbsink.wasm ./cmd/kbsink-wasm
          mkdir -p release
          goroot="$(go env GOROOT)"
          wasm_exec=""
          for cand in "$goroot/lib/wasm/wasm_exec.js" "$goroot/misc/wasm/wasm_exec.js"; do
            if [ -f "$cand" ]; then wasm_exec="$cand"; break; fi
          done
          if [ -z "$wasm_exec" ]; then
            echo "wasm_exec.js not found under GOROOT=$goroot" >&2
            exit 1
          fi
          cp "$wasm_exec" release/wasm_exec.js
          cp kbsink.wasm release/
          (cd release && tar -czf "kbsink_${ver}_wasm_js.tar.gz" wasm_exec.js kbsink.wasm)

      - uses: actions/upload-artifact@v4
        with:
          name: binary-wasm-js
          path: kbsink-cli/release/*.tar.gz

  publish:
    name: GitHub Release
    needs: [build, wasm]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: binary-*
          merge-multiple: true

      - name: SHA256 checksums
        run: |
          set -euo pipefail
          cd dist
          : > SHA256SUMS.txt
          for f in *.tar.gz *.exe; do
            [ -f "$f" ] || continue
            shasum -a 256 "$f" >> SHA256SUMS.txt
          done
          sort -k2 -o SHA256SUMS.txt SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
